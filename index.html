<!DOCTYPE html>
<html lang="cs" data-palette="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZ Kvíz</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      position: relative;
      font-family: system-ui, 'Segoe UI', sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem 2rem 4.5rem;
    }
    h1 { font-size: 3rem; letter-spacing: .08em; color: var(--color-text); }
    p  { color: var(--color-muted); max-width: 400px; text-align: center; line-height: 1.6; }
    .btns { display: flex; gap: 1rem; }
    a.btn {
      padding: .75rem 2rem;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      transition: background .15s;
    }
    .btn-play  { background: var(--color-accent); color: #fff; }
    .btn-play:hover { background: var(--color-accent-hover); }
    .btn-admin { background: transparent; border: 2px solid var(--color-border); color: var(--color-muted); }
    .btn-admin:hover { border-color: var(--color-muted); color: var(--color-text); }
  </style>
</head>
<body>
  <h1>AZ Kvíz</h1>
  <p>Vzdělávací hra pro celou třídu. Týmy soupeří o propojení hran trojúhelníkového hracího plánu.</p>
  <div class="palette-control">
    <label for="palette-select">Barevné schéma</label>
    <select id="palette-select" class="palette-select">
      <option value="light">Světlé</option>
      <option value="warm">Teplé</option>
      <option value="dark">Tmavé</option>
    </select>
  </div>
  <div class="btns">
    <a href="play.html" class="btn btn-play">🎮 Hrát</a>
    <a href="admin.html" class="btn btn-admin">⚙️ Admin</a>
  </div>
  <script type="module">
    import { initializePalettePicker } from './js/palette.js';
    initializePalettePicker(document.getElementById('palette-select'));
  </script>
</body>
</html>
